name: Drum Stem Offline Audio QA
# Revalidation requested for final combined DSP changes (2026-10-09).
# Compare GLUE threshold calibration against latest 48-metric real-stem baseline.
# A/B baseline after MASS and parallel GLUE change; noncommercial internal fixtures.
# Controlled comparison trial: FINISH onset guard 18ms -> 28ms; keep previous baseline.
# Revalidation on 6dbab03: current onset-gated FINISH DSP; retain reports for A/B.
on:
  workflow_dispatch:
  push:
    branches: [v1.0.0-engineering]
    paths: ['.github/workflows/drum-stem-audio-qa.yml', 'tests/offline_drum_qa.py', 'tests/offline_render.cpp', 'tests/DrumDSPQA.cpp', 'tests/DrumPrecisionQA.cpp', 'tests/DrumBypassQA.cpp', 'tests/DrumCoreTests.cpp', 'tests/expanded_module_qa.py', 'tests/dsp_function_diagnostics.py', 'tests/focused_mass_glue_qa.py', 'src/DrumCore.h', 'src/dsp/**']
jobs:
  audio-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual DrumCore offline renderer
        run: g++ -std=c++17 -O2 -I src tests/offline_render.cpp src/dsp/AdaptiveResonanceSuppressor.cpp -o drum_offline_render
      - name: Compile and run core, bypass and DSP contract regression tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -I src tests/DrumCoreTests.cpp src/dsp/AdaptiveResonanceSuppressor.cpp -o drum_core_tests
          ./drum_core_tests
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -I src tests/DrumBypassQA.cpp -o drum_bypass_qa
          ./drum_bypass_qa
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -I src tests/DrumDSPQA.cpp src/dsp/AdaptiveResonanceSuppressor.cpp -o drum_dsp_qa
          ./drum_dsp_qa
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -I src tests/DrumPrecisionQA.cpp src/dsp/AdaptiveResonanceSuppressor.cpp -o drum_precision_qa
          ./drum_precision_qa
      - name: Download, render and measure licensed drum-only fixtures
        run: python3 tests/offline_drum_qa.py ./drum_offline_render
      - name: Extended programme-level module measurements
        run: python3 tests/expanded_module_qa.py ./drum_offline_render
      - name: Diagnose MASS harmonics and GLUE dynamic response
        run: python3 tests/dsp_function_diagnostics.py ./drum_offline_render
      - name: Controlled MASS and GLUE input-level diagnostics
        run: python3 tests/focused_mass_glue_qa.py ./drum_offline_render
      - name: Upload metrics and small audio comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Drum-Finisher-Audio-QA
          path: audio-qa-output/
          if-no-files-found: warn
          retention-days: 14
