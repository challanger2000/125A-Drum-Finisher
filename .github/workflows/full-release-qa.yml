name: Drum Finisher Full Release QA
# Windows VST3 gate for independently clickable CHARACTER and BYPASS CTextButtons (2026-10-10).
# Require ctest + two Steinberg validation modes + 125A Plugin Tester on the same built VST3.
# Previous full release validation predates the current DSP; no inherited PASS is accepted.

on:
  workflow_dispatch:
  push:
    branches: [v1.0.0-engineering]
    paths: ['.github/workflows/full-release-qa.yml']

jobs:
  release-qa:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout Drum Finisher
        uses: actions/checkout@v4

      - name: Verify five native CTextButtons and two host parameter mappings
        run: python tests/gui_control_contract_qa.py

      - name: Configure Drum Finisher
        shell: pwsh
        run: |
          git clone --filter=blob:none --depth=1 --branch v3.8.1_build_84 --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git "$env:RUNNER_TEMP/vst3sdk"
          $actual = (git -C "$env:RUNNER_TEMP/vst3sdk" rev-parse HEAD).Trim()
          if ($actual -ne "3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96") { throw "Unexpected SDK revision $actual" }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DDRUM_BUILD_VST3=ON -DVST3_SDK_ROOT="${env:RUNNER_TEMP}/vst3sdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build plugin and complete internal QA
        run: cmake --build build --config Release --parallel 4

      - name: Run complete internal QA
        run: ctest --test-dir build -C Release --output-on-failure -V

      - name: Locate Drum Finisher VST3
        id: drum
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "125A_Drum_Finisher.vst3" | Select-Object -First 1
          if (-not $plugin) { throw "125A_Drum_Finisher.vst3 bundle not found" }
          "plugin=$($plugin.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Testing exact bundle: $($plugin.FullName)"

      - name: Verify GUI control tags in the EXACT packaged VST3 resource
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "125A_Drum_Finisher.vst3" | Select-Object -First 1
          if (-not $plugin) { throw "Built VST3 bundle missing" }
          $resource = Get-ChildItem -LiteralPath $plugin.FullName -Recurse -File -Filter "DrumFinisher.uidesc" | Select-Object -First 1
          if (-not $resource) { throw "Bundled DrumFinisher.uidesc resource missing" }
          [xml]$uidesc = Get-Content -LiteralPath $resource.FullName -Raw
          $tags = @{ Character = 106; Bypass = 107; Zoom = 9000;
                      CharacterTight = 9101; CharacterPunch = 9102;
                      CharacterDense = 9103; ActiveButton = 9104; BypassButton = 9105 }
          foreach ($name in $tags.Keys) {
            $binding = $uidesc.SelectSingleNode("/vstgui-ui-description/control-tags/control-tag[@name='$name']")
            if (-not $binding -or [int]$binding.tag -ne $tags[$name]) {
              throw "Bundled GUI tag $name incorrect"
            }
          }
          $buttons = $uidesc.SelectNodes("//view[@class='CTextButton']")
          if ($buttons.Count -ne 5) { throw "Expected exactly five native CTextButtons, found $($buttons.Count)" }
          foreach ($name in @('CharacterTight','CharacterPunch','CharacterDense','ActiveButton','BypassButton')) {
            $button = $uidesc.SelectSingleNode("//view[@class='CTextButton' and @control-tag='$name']")
            if (-not $button) { throw "Missing clickable CTextButton: $name" }
            if ($button.GetAttribute('mouse-enabled') -ne 'true') { throw "$name not mouse-enabled" }
          }
          $zoom = $uidesc.SelectSingleNode("//view[@class='CSegmentButton' and @control-tag='Zoom']")
          if (-not $zoom) { throw "Zoom is missing" }
          if ($uidesc.SelectNodes("//view[@class='CSegmentButton']").Count -ne 1) {
            throw "Unclickable CHARACTER or BYPASS segment buttons are still bundled"
          }
          Write-Host "EXACT packaged VST3: five real CHARACTER/BYPASS CTextButtons, host tags 106/107 and ZOOM verified"

      - name: Validate exact VST3 with Steinberg normal and local-instance modes
        shell: pwsh
        run: |
          $validator = Get-ChildItem -Path build -Recurse -File -Filter "validator.exe" | Where-Object { $_.FullName -match "[\\/]Release[\\/]" } | Select-Object -First 1
          if (-not $validator) { $validator = Get-ChildItem -Path build -Recurse -File -Filter "validator.exe" | Select-Object -First 1 }
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "125A_Drum_Finisher.vst3" | Select-Object -First 1
          if (-not $plugin) { throw "Exact Drum Finisher VST3 bundle not found" }
          if (-not $validator) { throw "Steinberg validator.exe was not built" }
          Write-Host "Steinberg Validator: $($validator.FullName)"
          Write-Host "Exact VST3: $($plugin.FullName)"
          & $validator.FullName $plugin.FullName
          if ($LASTEXITCODE -ne 0) { throw "Steinberg standard Validator FAILED: $LASTEXITCODE" }
          & $validator.FullName -l $plugin.FullName
          if ($LASTEXITCODE -ne 0) { throw "Steinberg local-instance Validator FAILED: $LASTEXITCODE" }

      - name: Checkout 125A Plugin Tester v0.2.9 source
        uses: actions/checkout@v4
        with:
          repository: challanger2000/125A-Plugin-Tester-Final
          ref: fd246146994384e301c735e7d860b53aa06b18c5
          path: _plugin-tester

      - name: Configure 125A Plugin Tester
        shell: pwsh
        run: |
          $prefix = Join-Path (Get-Location) "_plugin-tester-installed"
          cmake -S _plugin-tester -B _plugin-tester/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_INSTALL_PREFIX="$prefix" -DSMTG_CREATE_PLUGIN_LINK=0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and install 125A Plugin Tester
        run: cmake --build _plugin-tester/build --config Release --target install --parallel

      - name: Run 125A Plugin Tester v0.2.9
        shell: pwsh
        env:
          DRUM_PLUGIN: ${{ steps.drum.outputs.plugin }}
        run: |
          $tester = Get-ChildItem "_plugin-tester-installed" -Recurse -File -Filter "125A_Plugin_Tester.exe" | Select-Object -First 1
          if (-not $tester) { throw "125A_Plugin_Tester.exe not found after install" }

          $env:125A_PLUGIN_TESTER_REPORT_DIR = Join-Path (Get-Location) "plugin-tester-reports"
          Remove-Item $env:125A_PLUGIN_TESTER_REPORT_DIR -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:125A_PLUGIN_TESTER_REPORT_DIR | Out-Null

          $process = Start-Process -FilePath $tester.FullName -ArgumentList @($env:DRUM_PLUGIN) -Wait -PassThru
          Write-Host "125A Plugin Tester exit code: $($process.ExitCode)"

          $report = Get-ChildItem $env:125A_PLUGIN_TESTER_REPORT_DIR -File -Filter "*_125A_QA_Report.txt" | Select-Object -First 1
          $json = Get-ChildItem $env:125A_PLUGIN_TESTER_REPORT_DIR -File -Filter "*_125A_QA_Report.json" | Select-Object -First 1

          if (-not $report) { throw "125A Plugin Tester did not produce a QA report" }
          if (-not $json) { throw "125A Plugin Tester did not produce a JSON QA report" }

          Write-Host "----- 125A QA REPORT -----"
          Get-Content $report.FullName -Raw | Write-Host
          Write-Host "----- END 125A QA REPORT -----"

          $reportText = Get-Content $report.FullName -Raw
          $data = Get-Content $json.FullName -Raw | ConvertFrom-Json

          if ($data.status -ne "PASS") {
            throw "125A Plugin Tester result was $($data.status), expected PASS"
          }

          if (-not $reportText.Contains("0 WARNING / 0 FAIL")) {
            throw "125A Plugin Tester report was not clean"
          }

          if (-not $reportText.Contains("RELEASE: PASS")) {
            throw "125A Plugin Tester did not grant RELEASE: PASS"
          }

          if ($process.ExitCode -ne 0) {
            throw "125A Plugin Tester returned exit code $($process.ExitCode)"
          }

          Write-Host "125A FULL RELEASE QA: PASS"

      - name: Stage exact tested VST3
        shell: pwsh
        env:
          DRUM_PLUGIN: ${{ steps.drum.outputs.plugin }}
        run: |
          Remove-Item release-artifact -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force release-artifact | Out-Null
          Copy-Item -Path $env:DRUM_PLUGIN -Destination release-artifact -Recurse -Force

      - name: Upload exact tested VST3
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Drum-Finisher-V1-Full-Release-QA
          path: release-artifact

      - name: Upload complete 125A QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Drum-Finisher-Full-Release-QA-Reports
          path: plugin-tester-reports/*
          if-no-files-found: warn
