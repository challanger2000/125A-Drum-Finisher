name: Drum Finisher V1 Build and Core QA

on:
  push:
    branches: [v1.0.0-engineering]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Steinberg SDK with submodules
        shell: pwsh
        run: |
          git clone --filter=blob:none --depth=1 --branch v3.8.1_build_84 --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git "$env:RUNNER_TEMP/vst3sdk"
          $actual = (git -C "$env:RUNNER_TEMP/vst3sdk" rev-parse HEAD).Trim()
          if ($actual -ne "3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96") { throw "Unexpected SDK revision: $actual" }
      - name: Configure all targets
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DDRUM_BUILD_VST3=ON -DVST3_SDK_ROOT="${env:RUNNER_TEMP}/vst3sdk"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Contract tests
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      - name: Steinberg Validator on 125A Drum Finisher
        shell: pwsh
        run: |
          $validator = Get-ChildItem -Path build -Recurse -File -Filter "validator.exe" | Where-Object { $_.FullName -match "[\\/]Release[\\/]" } | Select-Object -First 1
          if (-not $validator) { $validator = Get-ChildItem -Path build -Recurse -File -Filter "validator.exe" | Select-Object -First 1 }
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "125A_Drum_Finisher.vst3" | Select-Object -First 1
          if (-not $plugin) { $plugin = Get-ChildItem -Path build -Recurse -File -Filter "125A_Drum_Finisher.vst3" | Select-Object -First 1 }
          if (-not $validator) { throw "Steinberg Validator executable missing" }
          if (-not $plugin) { throw "Drum Finisher VST3 bundle missing" }
          Write-Host "Validator: $($validator.FullName)"
          Write-Host "Plugin: $($plugin.FullName)"
          & $validator.FullName $plugin.FullName
          if ($LASTEXITCODE -ne 0) { throw "Steinberg Validator failed: $LASTEXITCODE" }
